name: Unit Tests

on:
  pull_request

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i

      - name: Test
        run: npm run test
